# SurrealDB consolidado para todos os projetos Oute.
# Uso (a partir da raiz do repo):
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#
# ATENÇÃO: o RocksDB permite apenas um processo por diretório de dados.
# Pare o container antigo (oute-surrealdb) antes de subir este.
services:
  oute-surreal-db:
    image: surrealdb/surrealdb:${SURREAL_VERSION:-v3.3.0}
    container_name: ${SURREAL_CONTAINER_NAME:-oute-surreal-db}
    restart: unless-stopped
    command:
      - start
      - --no-banner
      - --log
      - info
      - --bind
      - 0.0.0.0:8000
      - rocksdb:///data/surrealdb
    environment:
      SURREAL_USER: ${SURREAL_ROOT_USER:-root}
      SURREAL_PASS: ${SURREAL_ROOT_PASS:?defina SURREAL_ROOT_PASS no .env}
    ports:
      # Publicado apenas na bridge lxdbr0 (acessível aos containers LXC).
      - "${SURREAL_BIND_IP:-10.173.117.1}:${SURREAL_PORT:-8000}:8000"
    volumes:
      - ${SURREAL_DATA_DIR:-/mnt/lxd/oute-data/surrealdb}:/data/surrealdb
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
        aliases:
          - oute-surrealdb

networks:
  default:
    name: oute-surreal-db
