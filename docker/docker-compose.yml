# SurrealDB isolado para os projetos Oute. Instância NOVA: não compartilha rede, volume,
# alias nem container com o oute-agent (oute-surrealdb) ou qualquer outra stack do host.
#
# Uso (na raiz do repo, com .env preenchido):
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
name: oute-surreal-db

services:
  surrealdb:
    image: ${SURREAL_IMAGE:?defina SURREAL_IMAGE no .env}
    container_name: ${SURREAL_CONTAINER_NAME:-oute-surreal-db}
    restart: unless-stopped
    # Mesmo uid da imagem (nonroot). O dir de dados precisa pertencer a 10001:10001.
    user: "10001:10001"
    command:
      - start
      - --no-banner
      - --log
      - info
      - --bind
      - 0.0.0.0:8000
      - rocksdb:///data/surrealdb
    environment:
      SURREAL_USER: ${SURREAL_ROOT_USER:-root}
      SURREAL_PASS: ${SURREAL_ROOT_PASS:?defina SURREAL_ROOT_PASS no .env}
    mem_limit: ${SURREAL_MEM_LIMIT:-2g}
    cpus: ${SURREAL_CPUS:-1}
    ports:
      # Só na bridge lxdbr0. Outros containers Docker do host ainda alcançam este IP:
      # o bloqueio deles é feito pelo firewall (scripts/firewall_surreal.sh).
      - "${SURREAL_BIND_IP:-10.173.117.1}:${SURREAL_PORT:-8000}:8000"
    volumes:
      - ${SURREAL_DATA_DIR:?defina SURREAL_DATA_DIR no .env}:/data/surrealdb
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [surreal]

networks:
  surreal:
    name: oute-surreal-db
    driver_opts:
      # Nome fixo da bridge para o firewall referenciar (máx. 15 chars).
      com.docker.network.bridge.name: br-oute-sdb
